name: Gesetze nach Discord veröffentlichen

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, nichts posten"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dateien nach Discord posten
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN || secrets.BOTTOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID || vars.DISCORD_CHANNEL_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/publish-laws.mjs
