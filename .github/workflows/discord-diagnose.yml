name: Discord-Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  channels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bot-Guilds und Channels auflisten
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.BOTTOKEN || secrets.DISCORD_BOT_TOKEN }}
        run: |
          node --input-type=module <<'EOF'
          const token = process.env.DISCORD_BOT_TOKEN;
          if (!token) {
            console.error("Kein Bot-Token gefunden (Secret BOTTOKEN).");
            process.exit(1);
          }

          const api = async (path) => {
            const response = await fetch(`https://discord.com/api/v10${path}`, {
              headers: { Authorization: `Bot ${token}` },
            });
            if (!response.ok) {
              throw new Error(`${path}: HTTP ${response.status} ${(await response.text()).slice(0, 300)}`);
            }
            return response.json();
          };

          const guilds = await api("/users/@me/guilds");
          console.log(`Guilds: ${guilds.length}`);

          const app = await api("/oauth2/applications/@me");
          console.log(`Bot: ${app.name} (${app.id})`);
          console.log(
            `Invite: https://discord.com/oauth2/authorize?client_id=${app.id}` +
              "&permissions=66560&scope=bot%20applications.commands",
          );

          for (const guild of guilds) {
            console.log(`\n== ${guild.name} (${guild.id}) ==`);
            const channels = await api(`/guilds/${guild.id}/channels`);
            const types = { 0: "TEXT", 5: "NEWS", 15: "FORUM", 16: "MEDIA", 4: "CATEGORY" };
            for (const channel of channels.sort((a, b) => a.position - b.position)) {
              if (!types[channel.type]) continue;
              const parent = channel.parent_id ? ` (Kategorie ${channel.parent_id})` : "";
              console.log(`${types[channel.type].padEnd(8)} #${channel.name} -> ${channel.id}${parent}`);
            }
          }
          EOF
