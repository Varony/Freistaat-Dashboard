name: Discord-Sync Gesetze

on:
  push:
    branches: [main, master]
    paths:
      - "content/Gesetze.md"
      - "scripts/sync-discord.mjs"
      - ".github/workflows/sync-gesetze.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, nichts in Discord ändern"
        type: boolean
        default: false
      force:
        description: "Alle Abschnitte neu schreiben"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: discord-sync-gesetze
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Nach Discord synchronisieren
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: node scripts/sync-discord.mjs

      - name: Sync-Status committen
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$(git status --porcelain .discord-sync/gesetze.json)" ]; then
            echo "Kein Statuswechsel."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .discord-sync/gesetze.json
          git commit -m "chore(discord): sync state [skip ci]"
          git push
