name: Gesetze nach Discord veröffentlichen

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, nichts posten"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Gesetze nach Discord posten
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN || secrets.BOTTOKEN }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          DISCORD_INDEX_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/publish-laws.mjs

      - name: Publish-State committen
        if: ${{ !inputs.dry_run }}
        run: |
          if [ ! -f content/discord-publish-state.json ]; then
            echo "Kein Publish-State vorhanden."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/discord-publish-state.json
          if git diff --cached --quiet -- content/discord-publish-state.json; then
            echo "Keine Änderung."
            exit 0
          fi

          git commit -m "chore(discord): update publish state"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Vercel-Deploy auslösen
        if: ${{ !inputs.dry_run }}
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Kein Vercel-Deploy-Hook gesetzt – übersprungen."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
          echo "Vercel-Deploy-Hook ausgelöst."
