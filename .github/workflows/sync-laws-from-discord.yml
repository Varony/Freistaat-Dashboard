name: Gesetze aus Discord

on:
  schedule:
    # Alle 15 Minuten. GitHub kann den Lauf um einige Minuten verzögern.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, Dateien nicht ändern"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gesetze-from-discord
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Konfiguration prüfen
        id: config
        env:
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
        run: |
          if [ -z "$DISCORD_GUILD_ID" ]; then
            echo "::warning::DISCORD_GUILD_ID fehlt. Lege eine Repository-Variable DISCORD_GUILD_ID an."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Channels lesen und Markdown erzeugen
        if: steps.config.outputs.skip != 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN || secrets.BOTTOKEN }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/sync-laws-from-discord.mjs

      - name: Änderung committen
        if: ${{ !inputs.dry_run && steps.config.outputs.skip != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/*.md content/discord-channels.json
          if git diff --cached --quiet; then
            echo "Keine Änderung."
            exit 0
          fi

          git commit -m "chore(gesetze): sync from Discord"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
