name: Gesetze aus Discord

on:
  # Alle 15 Minuten. GitHub kann den Lauf um einige Minuten verzögern.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, Datei nicht ändern"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gesetze-from-discord
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Channel lesen und Markdown erzeugen
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN || secrets.BOTTOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID || vars.DISCORD_CHANNEL_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/sync-from-discord.mjs

      - name: Ergebnis prüfen
        if: ${{ !inputs.dry_run }}
        run: |
          test -s content/Gesetze.md
          grep -q '^## ' content/Gesetze.md

      - name: Änderung committen
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/Gesetze.md
          if git diff --cached --quiet -- content/Gesetze.md; then
            echo "Keine Änderung."
            exit 0
          fi

          git commit -m "chore(gesetze): sync from Discord"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
